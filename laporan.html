<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan - Laundry Kiloan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧺%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SIDEBAR NAVIGASI (sama di semua halaman) -->
<aside class="sidebar" id="sidebar">
  <div class="brand">🧺 Kiloan Laundry<small>Pengelolaan Laundry Kiloan</small></div>
  <ul class="menu" id="menu">
    <li><a href="index.html">🏠 Dashboard</a></li>
    <li><a href="pelanggan.html">👥 Data Pelanggan</a></li>
    <li><a href="transaksi.html">📦 Transaksi Laundry</a></li>
    <li class="active"><a href="laporan.html">📊 Laporan</a></li>
    <li><a href="pengaturan.html">⚙️ Pengaturan</a></li>
  </ul>
</aside>

<div class="main">
  <header class="header">
    <button class="burger" id="burger" aria-label="Menu">☰</button>
    <h2>Laporan</h2>
    <span class="user">Halo, Admin</span>
  </header>

  <section class="page" id="page-laporan">
    <div class="box"><div class="bar">
      <div><label>Dari</label><input type="date" id="lapDari"></div>
      <div><label>Sampai</label><input type="date" id="lapSampai"></div>
      <button class="btn btn-p" id="btnLap" style="align-self:flex-end">Tampilkan</button>
      <button class="btn" id="btnCsv" style="align-self:flex-end">⬇️ Export CSV</button>
    </div></div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="ico">💰</div><div><small>Total Pendapatan</small><b id="lapUang">Rp 0</b></div></div>
      <div class="stat"><div class="ico">🧾</div><div><small>Jumlah Transaksi</small><b id="lapJml">0</b></div></div>
      <div class="stat"><div class="ico">⚖️</div><div><small>Total Berat</small><b id="lapKg">0 kg</b></div></div>
    </div>
    <div class="box"><h3>Detail Transaksi (status Diambil)</h3><div class="tw"><table><thead><tr><th>Tgl Selesai</th><th>Kode</th><th>Pelanggan</th><th>Layanan</th><th>Berat</th><th>Total</th></tr></thead><tbody id="tbLap"></tbody></table></div></div>
  </section>
</div>

<div id="toasts"></div>

<script src="js/app.js"></script>
<script src="js/laporan.js"></script>
</body>
</html>
