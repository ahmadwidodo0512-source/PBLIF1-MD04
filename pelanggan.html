<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Pelanggan - Laundry Kiloan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧺%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SIDEBAR NAVIGASI (sama di semua halaman) -->
<aside class="sidebar" id="sidebar">
  <div class="brand">🧺 Kiloan Laundry<small>Pengelolaan Laundry Kiloan</small></div>
  <ul class="menu" id="menu">
    <li><a href="index.html">🏠 Dashboard</a></li>
    <li class="active"><a href="pelanggan.html">👥 Data Pelanggan</a></li>
    <li><a href="transaksi.html">📦 Transaksi Laundry</a></li>
    <li><a href="laporan.html">📊 Laporan</a></li>
    <li><a href="pengaturan.html">⚙️ Pengaturan</a></li>
  </ul>
</aside>

<div class="main">
  <header class="header">
    <button class="burger" id="burger" aria-label="Menu">☰</button>
    <h2>Data Pelanggan</h2>
    <span class="user">Halo, Admin</span>
  </header>

  <section class="page" id="page-pelanggan">
    <div class="box">
      <div class="bar"><input id="cariPel" placeholder="🔍 Cari nama, no. HP, atau alamat..."><button class="btn btn-p" id="btnTambahPel">+ Tambah Pelanggan</button></div>
      <div class="tw"><table><thead><tr><th>No</th><th>Nama</th><th>No. HP</th><th>Alamat</th><th>Total Transaksi</th><th>Aksi</th></tr></thead><tbody id="tbPel"></tbody></table></div>
    </div>
  </section>
</div>

<!-- MODAL PELANGGAN -->
<div class="overlay" id="modalPel"><div class="modal">
  <h3 id="modalPelJudul">Tambah Pelanggan</h3>
  <input type="hidden" id="pelId">
  <div class="fg"><label>Nama *</label><input id="pelNama"><div class="err" id="ePelNama"></div></div>
  <div class="fg"><label>No. HP *</label><input id="pelHp" inputmode="numeric" placeholder="08xxxxxxxxxx"><div class="err" id="ePelHp"></div></div>
  <div class="fg"><label>Alamat</label><textarea id="pelAlamat" rows="2"></textarea></div>
  <div class="acts"><button class="btn" id="btnBatalPel">Batal</button><button class="btn btn-p" id="btnSimpanPel">Simpan</button></div>
</div></div>
<div id="toasts"></div>

<script src="js/app.js"></script>
<script src="js/pelanggan.js"></script>
</body>
</html>
